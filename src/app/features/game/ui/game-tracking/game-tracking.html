<app-track-control
  [gameTitle]="game().title"
  [status]="trackedEntry()?.status ?? null"
  [pinned]="trackedEntry()?.pinPosition != null"
  [busy]="tracked.busy().has(game().id)"
  [signedIn]="signedIn()"
  (track)="track($event)"
  (untrack)="untrack()"
  (pinToggle)="togglePin()"
/>
@if (trackMessage(); as m) {
  <p class="alert" role="alert">{{ m }}</p>
}
@if (signedIn()) {
  <a
    class="btn btn-secondary ask-ai"
    [routerLink]="'/assistant/chat/' + game().id"
    [queryParams]="{ game: game().title, slug: game().slug }"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" />
    </svg>
    Ask the AI about this game
  </a>
}
