<main class="page picker">
  <app-page-header heading="Pick achievements" backLink="/profile" backLabel="Back to Profile" />

  @if (picker.error(); as e) {
    <p class="alert" role="alert">{{ e }}</p>
  }

  <router-outlet />

  <div class="bar">
    @if (trayOpen()) {
      <ol class="tray" aria-label="Your picks, in order">
        @for (p of picker.picked(); track p.achievementId) {
          <li>
            <span class="text"
              ><span class="name">{{ p.name }}</span
              ><span class="muted">{{ p.gameTitle }}</span></span
            >
            <button
              type="button"
              class="remove"
              [attr.aria-label]="'Remove ' + p.name"
              (click)="picker.remove(p.achievementId)"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18" /></svg>
            </button>
          </li>
        } @empty {
          <li class="muted">Nothing picked yet.</li>
        }
      </ol>
    }
    @if (error(); as e) {
      <p class="alert" role="alert">{{ e }}</p>
    }
    <div class="actions">
      <button
        type="button"
        class="count"
        [attr.aria-expanded]="trayOpen()"
        (click)="trayOpen.set(!trayOpen())"
      >
        {{ picker.count() }} of {{ picker.max }} picked
        <svg viewBox="0 0 24 24" aria-hidden="true" [class.up]="trayOpen()">
          <path d="M6 15l6-6 6 6" />
        </svg>
      </button>
      <button
        type="button"
        class="btn btn-primary save"
        [disabled]="!picker.loaded() || picker.saving() || !picker.dirty()"
        (click)="save()"
      >
        {{ picker.saving() ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </div>
</main>
