<app-search-box
  label="Find one of your games"
  placeholder="Find one of your games"
  (typed)="search($event)"
/>

<app-segmented label="Order" [options]="orders" [value]="sort()" (changed)="setSort($event)" />

@if (failed()) {
  <p class="alert" role="alert">Your games didn’t load.</p>
  <button type="button" class="btn btn-secondary" (click)="load(0)">Try again</button>
}

<ul class="games">
  @for (g of games(); track g.gameId) {
    <li>
      <a [routerLink]="['./', g.gameId]">
        <app-game-cover class="cover" [src]="g.coverImageUrl" [title]="g.title" />
        <span class="text">
          <span class="name">{{ g.title }}</span>
          <span class="muted">{{ g.unlocked }} of {{ g.total }} unlocked</span>
        </span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
      </a>
    </li>
  } @empty {
    @if (!loading() && !failed()) {
      <li class="muted">No games with unlocks match.</li>
    }
  }
</ul>

@if (loading()) {
  <p class="muted" role="status">Loading…</p>
} @else if (hasMore()) {
  <button type="button" class="btn btn-secondary" (click)="more()">Show more</button>
}
