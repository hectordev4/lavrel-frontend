<main class="setup">
  @if (account.user(); as user) {
    <app-cube-logo class="mark" mode="intro" label="" />
    <h1>Make it yours</h1>
    <p class="lead">
      This is how other players will see you. Change anything now, or skip and keep what we picked
      for you.
    </p>

    <form class="form" (submit)="$event.preventDefault(); save(name.value, country.value)">
      <div class="avatar-row">
        <app-avatar
          class="avatar"
          [avatar]="me.avatar()"
          [seed]="me.seed()"
          [initial]="initial()"
          label="Your avatar"
        />
        <button type="button" class="btn btn-secondary" (click)="avatarOpen.set(true)">
          Change avatar
        </button>
      </div>

      <label class="field">
        <span>Name others see</span>
        <input
          #name
          type="text"
          maxlength="20"
          autocomplete="nickname"
          [value]="user.username ?? ''"
          (input)="error.set(null)"
        />
        <span class="hint">It doesn’t need to be unique: your player id tells you apart.</span>
      </label>

      <label class="field">
        <span>Country (optional)</span>
        <select #country class="select">
          <option value="">Not set</option>
          @for (c of account.countries(); track c.id) {
            <option [value]="c.id" [selected]="c.id === user.countryId">{{ c.name }}</option>
          }
        </select>
        <span class="hint"
          >Only used to show how players in your country do on each achievement.</span
        >
      </label>

      @if (error(); as e) {
        <p class="alert" role="alert">{{ e }}</p>
      }

      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'Saving…' : 'Save and continue' }}
      </button>
      <button type="button" class="link-btn skip" [disabled]="saving()" (click)="skip()">
        Skip for now
      </button>
    </form>
  } @else if (account.state().kind === 'error') {
    <p class="alert" role="alert">Your profile didn’t load.</p>
    <button type="button" class="btn btn-secondary" (click)="account.load()">Try again</button>
    <button type="button" class="link-btn skip" (click)="skip()">Skip for now</button>
  } @else {
    <app-cube-logo class="mark" mode="loading" label="Loading" />
  }
</main>

<app-modal heading="Choose your avatar" [open]="avatarOpen()" (closed)="avatarOpen.set(false)">
  @if (avatarOpen()) {
    <app-avatar-picker (done)="avatarOpen.set(false)" />
  }
</app-modal>
