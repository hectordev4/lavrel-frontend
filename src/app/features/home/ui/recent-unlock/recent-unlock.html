<a class="item" [routerLink]="link()" [class.rare]="rare()">
  <span class="icon" aria-hidden="true">
    @if (unlock().iconUrl) {
      <img [src]="unlock().iconUrl" alt="" loading="lazy" />
    } @else {
      <svg viewBox="0 0 24 24">
        <path
          d="M8 4h8v5a4 4 0 0 1-8 0z M16 5h3v2a3 3 0 0 1-3 3 M8 5H5v2a3 3 0 0 0 3 3 M12 13v4 M9 20h6"
        />
      </svg>
    }
  </span>
  <span class="text">
    <span class="name">{{ unlock().name }}</span>
    <span class="meta">{{ unlock().gameTitle }} · {{ when() }}</span>
  </span>
  @if (unlock().globalPercent !== null) {
    <span class="share">{{ rare() ? 'Rare · ' : '' }}{{ unlock().globalPercent }}% of players</span>
  }
</a>
