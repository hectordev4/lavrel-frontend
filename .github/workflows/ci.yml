# Builds the app and runs the unit tests on every push and pull request.
name: CI

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'ci/**']
  pull_request:
    branches: [main, dev]

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The real environment files are git-ignored; the template is enough to build and test.
      - name: Create environment files from the template
        run: |
          cp src/environments/environment.example.ts src/environments/environment.ts
          cp src/environments/environment.example.ts src/environments/environment.development.ts

      - name: Build (production)
        run: npm run build

      - name: Unit tests
        run: npm run test:ci
